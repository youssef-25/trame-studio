<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trame Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Lexend:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Caveat:wght@600&family=Bitter:wght@500;700&display=swap">
<script src="jszip.min.js"></script>
<style>
/* Layout: workspace grid — slide list | canvas over timeline | inspector, ribbon on top like an authoring suite */
/* ===== THÈME CLAIR / SOMBRE =====
   Toutes les couleurs de l'interface sont des variables CSS (--bg, --panel, --fg...).
   Elles sont définies 3 fois ; il suffit de changer l'attribut data-theme sur <html>
   pour basculer toute l'interface d'un coup. */
/* 1) Couleurs CLAIRES par défaut (+ polices) */
:root{--bg:#e6eaec;--panel:#fbfcfc;--panel2:#f0f3f4;--line:#d3dadd;--fg:#162024;--muted:#5a6a71;--accent:#0d6e6e;--accent-fg:#ffffff;--accent-soft:#d9eeeb;--danger:#b42318;--warn:#9a5b06;--sel:#e8762d;
--sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--display:'Lexend','IBM Plex Sans',sans-serif}
/* 2) Couleurs SOMBRES si Windows est en mode sombre, SAUF si l'utilisateur a choisi "light" avec le bouton */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1416;--panel:#161d20;--panel2:#1c2529;--line:#2b363b;--fg:#e2e9ec;--muted:#92a2a9;--accent:#3eb3a5;--accent-fg:#062421;--accent-soft:#16393a;--danger:#f0786b;--warn:#e0a54a;--sel:#f08a45;color-scheme:dark}}
/* 3) Couleurs SOMBRES si l'utilisateur a choisi "dark" avec le bouton (quel que soit le réglage de Windows) */
:root[data-theme="dark"]{--bg:#0e1416;--panel:#161d20;--panel2:#1c2529;--line:#2b363b;--fg:#e2e9ec;--muted:#92a2a9;--accent:#3eb3a5;--accent-fg:#062421;--accent-soft:#16393a;--danger:#f0786b;--warn:#e0a54a;--sel:#f08a45;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.ptitle{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:600;font-size:14px;min-width:0;width:280px;max-width:40vw}
.ptitle:hover,.ptitle:focus{border-color:var(--line);background:var(--panel);outline:none}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 7px;font-size:12px}
.btn.icon{padding:5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ribbon{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
.rgroup{display:flex;flex-direction:column;gap:3px;padding:0 6px;border-right:1px solid var(--line)}
.rgroup:last-child{border-right:0}
.rbtns{display:flex;gap:2px;flex-wrap:wrap}
.rlabel{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.rb{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;background:none;border-radius:7px;padding:4px 6px;cursor:pointer;min-width:52px;font-size:11px}
.rb:hover{background:var(--panel2);border-color:var(--line)}
.rb svg{width:20px;height:20px}
.rb select{font-size:11px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:1px}
.work{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:8px;min-height:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;font-size:12px}
.pane-b{overflow:auto;flex:1;min-height:0}
/* slides */
#slides{padding:6px 8px 20px}
.scene{margin-top:8px}
.scene-h{display:flex;align-items:center;gap:4px;padding:2px 0 6px}
.scene-h input{flex:1;min-width:0;border:1px solid transparent;background:none;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:3px 4px;border-radius:4px}
.scene-h input:focus{border-color:var(--line);outline:none;color:var(--fg)}
.sl{position:relative;display:grid;grid-template-columns:18px 1fr;gap:6px;padding:6px 4px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.sl:hover{background:var(--panel2)}
.sl.on{border-color:var(--accent);background:var(--accent-soft)}
.sl-n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;padding-top:2px;text-align:right}
.thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:4px;border:1px solid var(--line);background:#fff;max-width:100%}
.thumb-in{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.sl-t{grid-column:2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.badge{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:4px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);flex-shrink:0}
.badge.quiz{color:var(--accent);border-color:var(--accent)}
.sl-tools{position:absolute;right:4px;top:4px;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px}
.sl:hover .sl-tools,.sl.on .sl-tools{display:flex}
.sl-tools button{border:0;background:none;cursor:pointer;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;padding:0}
.sl-tools button:hover{background:var(--panel2)}
.sl-tools svg{width:13px;height:13px}
/* center */
.center{display:grid;grid-template-rows:minmax(0,1fr) 200px;gap:8px;min-height:0;min-width:0}
.canvas-wrap{position:relative;overflow:auto;background:var(--panel2);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
.canvas-info{position:absolute;left:10px;top:8px;font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;z-index:2;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.chip.layer{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.state{border-color:var(--sel);color:var(--sel);font-weight:600}
#sizer{position:relative;margin:36px auto 24px;box-shadow:0 10px 30px rgba(20,40,50,.18)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff}
.ed-ghost{position:absolute;inset:0;opacity:.32;pointer-events:none;filter:grayscale(.5)}
.ed-layer{position:absolute;inset:0}
.ed-obj{cursor:move}
.ed-obj.ed-hotspot .tr-body{background:rgba(232,118,45,.14)!important;border:2px dashed #e8762d!important}
.ed-obj:hover{outline:1px dashed rgba(13,110,110,.7)}
.ed-sel{position:absolute;outline:2px solid var(--sel);pointer-events:none;z-index:50}
.ed-h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--sel);border-radius:3px;pointer-events:auto}
.h-nw{left:-7px;top:-7px;cursor:nwse-resize}.h-n{left:calc(50% - 6px);top:-7px;cursor:ns-resize}.h-ne{right:-7px;top:-7px;cursor:nesw-resize}.h-e{right:-7px;top:calc(50% - 6px);cursor:ew-resize}
.h-se{right:-7px;bottom:-7px;cursor:nwse-resize}.h-s{left:calc(50% - 6px);bottom:-7px;cursor:ns-resize}.h-sw{left:-7px;bottom:-7px;cursor:nesw-resize}.h-w{left:-7px;top:calc(50% - 6px);cursor:ew-resize}
/* timeline */
#timeline{display:flex;flex-direction:column;min-height:0}
.tl-h{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.tl-h strong{font-weight:600}
.tl-h input{width:64px;border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:var(--panel)}
.tl-body{overflow:auto;flex:1;min-height:0}
.tl-grid{display:grid;grid-template-columns:150px minmax(240px,1fr);min-width:420px}
.tl-name{padding:0 8px;height:26px;display:flex;align-items:center;gap:6px;font-size:12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--panel);z-index:1}
.tl-name.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.tl-name svg{width:13px;height:13px;flex-shrink:0;color:var(--muted)}
.tl-track{position:relative;height:26px;border-bottom:1px solid var(--line)}
.tl-ruler{position:relative;height:22px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);font-family:var(--mono)}
.tl-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding-left:3px;line-height:22px}
.tl-bar{position:absolute;top:4px;height:18px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent);cursor:grab;font-size:10px;padding:0 6px;line-height:16px;overflow:hidden;white-space:nowrap;color:var(--fg);min-width:6px}
.tl-bar.on{background:var(--accent);color:var(--accent-fg)}
.tl-bar.audio{background:#e9e2f7;border-color:#7c5cc4;color:#3f2a78}.tl-bar.audio.on{background:#7c5cc4;color:#fff}
/* Barres audio de la timeline : leur couleur ci-dessus est écrite en dur (violet clair),
   donc on la remplace par un violet foncé en mode sombre (mêmes 2 conditions que les variables du thème).
   :not(.on) = on ne touche pas à la barre sélectionnée, déjà lisible. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tl-bar.audio:not(.on){background:#2a2340;color:#d6c9f5}}
:root[data-theme="dark"] .tl-bar.audio:not(.on){background:#2a2340;color:#d6c9f5}
.tl-bar .rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(0,0,0,.12)}
.tl-empty{padding:16px;color:var(--muted)}
/* inspector */
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:9px 4px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:10px;margin-left:3px;color:var(--muted)}
#panel{padding:10px 12px 40px;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:7px}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>label{flex:1;min-width:0}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 7px;font-size:12.5px;color:var(--fg);width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:60px;line-height:1.4}
.fld input[type=color]{padding:1px;height:30px;cursor:pointer}
.fld input[type=checkbox]{width:auto}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg);cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:4px 6px;cursor:pointer;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.note{font-size:12px;color:var(--muted);line-height:1.45;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.note.state{border-color:var(--sel);color:var(--fg)}
.note code{font-family:var(--mono);font-size:11px;background:var(--panel);padding:0 3px;border-radius:3px}
.item{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item-h{display:flex;align-items:flex-start;gap:6px;cursor:pointer}
.item-h .grow{flex:1;min-width:0;font-size:12px;line-height:1.4}
.trig-s b{color:var(--accent);font-weight:600}
.trig-s i{font-style:normal;color:var(--sel);font-weight:600}
.mini{border:0;background:none;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--muted);flex-shrink:0;padding:0}
.mini:hover{background:var(--panel2);color:var(--fg)}
.mini svg{width:14px;height:14px}
.choice-row{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.pair-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.cond-row{display:grid;grid-template-columns:1.2fr .7fr 1fr auto;gap:4px;align-items:center}
.st-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.st-row.on{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 10%,var(--panel))}
.st-row .grow{flex:1}
.empty{color:var(--muted);text-align:center;padding:20px 10px;line-height:1.5}
/* overlays */
.modal-bg{position:fixed;inset:0;background:rgba(8,14,16,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(620px,100%);max-height:90%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-h{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:16px}
.modal-b{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.vt{width:100%;border-collapse:collapse}
.vt th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:4px}
.vt td{padding:3px 4px}
.preview{position:fixed;inset:0;z-index:90;background:#0b0f11;display:grid;grid-template-rows:auto 1fr}
.preview-h{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:#11181b;color:#e6edf0;border-bottom:1px solid #263136;flex-wrap:wrap}
.preview-h .btn{background:#1b2428;border-color:#30404a;color:#e6edf0}
.preview-h .btn.primary{background:#3eb3a5;color:#062421;border-color:#3eb3a5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
textarea.code{font-family:var(--mono);font-size:11px;height:160px;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:8px}
@media (max-width:1100px){.work{grid-template-columns:180px minmax(0,1fr) 290px}}
@media (max-width:900px){
 body{overflow:auto}
 #app{height:auto;min-height:100%}
 .work{grid-template-columns:minmax(0,1fr)}
 .pane.slides-pane{max-height:220px}
 .center{grid-template-rows:auto 200px}
 .canvas-wrap{min-height:280px}
 .pane.insp{max-height:none}
 .ptitle{width:100%;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style id="player-css">.tp{--tp-accent:#0d6e6e;--tp-bg:#141a1d;--tp-bar:#1c2427;--tp-line:#2b363b;--tp-fg:#e8eef0;--tp-mut:#97a6ad;position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto;background:var(--tp-bg);color:var(--tp-fg);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;overflow:hidden;color-scheme:dark}
.tp *{box-sizing:border-box}
.tp-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--tp-bar);border-bottom:1px solid var(--tp-line)}
.tp-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-count{color:var(--tp-mut);font-variant-numeric:tabular-nums;font-size:13px}
.tp-main{position:relative;display:flex;min-height:0}
.tp-drawer{width:0;overflow:hidden;background:var(--tp-bar);border-right:1px solid var(--tp-line);transition:width .25s ease;display:flex;flex-direction:column;flex-shrink:0}
.tp.drawer-open .tp-drawer{width:250px}
.tp-tabs{display:flex;border-bottom:1px solid var(--tp-line);min-width:250px}
.tp-tab{flex:1;background:none;border:0;color:var(--tp-mut);padding:10px 4px;font:inherit;font-size:12px;cursor:pointer;border-bottom:2px solid transparent}
.tp-tab.on{color:var(--tp-fg);border-bottom-color:var(--tp-accent)}
.tp-panel{overflow:auto;padding:8px;min-width:250px;flex:1}
.tp-scene{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tp-mut);padding:10px 8px 4px}
.tp-mi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tp-fg);font:inherit;padding:7px 10px;border-radius:6px;cursor:pointer;opacity:.85}
.tp-mi.seen{opacity:1}.tp-mi.seen::before{content:"✓ ";color:var(--tp-accent)}
.tp-mi.on{background:rgba(255,255,255,.08);opacity:1}
.tp-mi:disabled{opacity:.35;cursor:not-allowed}
.tp-notes{white-space:pre-wrap;line-height:1.55;padding:6px;color:var(--tp-fg)}
.tp-gl{padding:8px 6px;border-bottom:1px solid var(--tp-line)}.tp-gl p{margin:4px 0 0;color:var(--tp-mut);line-height:1.45}
.tp-res{display:block;color:var(--tp-fg);padding:8px 6px;text-decoration:underline;text-decoration-color:var(--tp-accent)}
.tp-wrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
.tp-sizer{position:relative;flex-shrink:0;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.tp-stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff}
.tp-layer{position:absolute;inset:0;pointer-events:none}
.tp-layer>*{pointer-events:auto}
.tp-foot{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--tp-bar);border-top:1px solid var(--tp-line);flex-wrap:wrap}
.tp-b{background:transparent;color:var(--tp-fg);border:1px solid var(--tp-line);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.tp-b:hover{border-color:var(--tp-mut)}
.tp-primary{background:var(--tp-accent);border-color:var(--tp-accent);color:#fff}
.tp-primary:hover{filter:brightness(1.12)}
.tp-ib{background:transparent;border:1px solid var(--tp-line);color:var(--tp-fg);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:14px;flex-shrink:0}
.tp-b:focus-visible,.tp-ib:focus-visible,.tp-mi:focus-visible,.tp-tab:focus-visible,.tp-click:focus-visible{outline:2px solid var(--tp-accent);outline-offset:2px}
.tp-seek{flex:1;min-width:80px;height:6px;background:var(--tp-line);border-radius:3px;cursor:pointer;position:relative}
.tp-seek-fill{position:absolute;left:0;top:0;bottom:0;background:var(--tp-accent);border-radius:3px;width:0}
.tp-toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#fff;color:#172126;padding:10px 16px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:600;z-index:20}
.tp-cover{position:absolute;inset:0;background:rgba(10,16,18,.92);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px}
.tp-cover-in{text-align:center;max-width:560px}.tp-cover-in h1,.tp-cover-in h2{font-family:'Lexend',system-ui,sans-serif;margin:0 0 10px;text-wrap:balance}.tp-cover-in p{color:var(--tp-mut);margin:0 0 22px}
.tp-big{padding:14px 34px;font-size:17px;border-radius:999px}
.tp-click{cursor:pointer}.tp-hidden{visibility:hidden!important}.tp-disabled{pointer-events:none!important}
.tr-obj{position:absolute;user-select:none}
.tr-anim{position:absolute;inset:0}
.tr-body{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.tr-text{white-space:pre-wrap;word-wrap:break-word;width:100%}
.tr-image .tr-body img{width:100%;height:100%;display:block}
.tr-input .tr-body input{width:100%;height:100%;border:0;background:transparent;font:inherit;color:inherit;padding:0 12px;outline:none}
.tr-input .tr-body:focus-within{box-shadow:0 0 0 3px rgba(13,110,110,.35)}
.tr-slider .tr-body{justify-content:center}.tr-slider input{width:100%;accent-color:#0d6e6e}
.tr-video video,.tr-audio audio{width:100%;height:100%;display:block;background:#000}
.tr-audio audio{background:transparent}
.tr-bgaudio{visibility:hidden!important;pointer-events:none!important}
.tr-audio.tr-hideplayer .tr-body{outline:2px dashed #7c5cc4;outline-offset:2px;border-radius:8px;opacity:.55}
.tr-audio.tr-hideplayer .tr-anim::after{content:"Hidden during presentation";position:absolute;left:0;right:0;top:-22px;font:600 11px system-ui;color:#7c5cc4;text-align:center}
.tr-media-empty{flex:1;display:flex;align-items:center;justify-content:center;background:#e6ecee;color:#4a5960;font:600 15px system-ui;border:2px dashed #b3c0c5;border-radius:8px}
.tq{--tq-accent:#0d6e6e;height:100%;display:flex;flex-direction:column;gap:18px;font-family:'Lexend',system-ui,sans-serif;color:#172126;text-align:left}
.tq-prompt{font-size:26px;font-weight:600;line-height:1.3;text-wrap:balance}
.tq-choices{display:flex;flex-direction:column;gap:10px}
.tq-choice{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid #d3dcdf;border-radius:12px;padding:14px 18px;font:inherit;font-size:19px;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.tq-choice:hover:not(:disabled){border-color:var(--tq-accent)}
.tq-choice.on{border-color:var(--tq-accent);background:color-mix(in srgb,var(--tq-accent) 10%,#fff)}
.tq-choice:disabled{cursor:default}
.tq-mark{width:22px;height:22px;border-radius:50%;border:2px solid #9aa9af;flex-shrink:0;display:grid;place-items:center}
.tq-mark.sq{border-radius:5px}
.tq-choice.on .tq-mark{border-color:var(--tq-accent);background:var(--tq-accent);box-shadow:inset 0 0 0 3px #fff}
.tq-fill{font:inherit;font-size:22px;padding:14px 18px;border:2px solid #d3dcdf;border-radius:12px;width:100%;max-width:520px;color:inherit;background:#fff}
.tq-fill:focus{outline:none;border-color:var(--tq-accent)}
.tq-order{display:flex;flex-direction:column;gap:8px}
.tq-orow{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #d3dcdf;border-radius:12px;padding:10px 12px;font-size:18px}
.tq-onum{width:30px;height:30px;border-radius:50%;background:var(--tq-accent);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;flex-shrink:0}
.tq-otxt{flex:1}
.tq-obtn{width:34px;height:34px;border:1px solid #c5d0d4;background:#f4f7f8;border-radius:8px;cursor:pointer;color:#33444b}
.tq-obtn:disabled{opacity:.35;cursor:default}
.tq-dd{display:grid;grid-template-columns:1fr 1.6fr;gap:20px;flex:1;min-height:0}
.tq-pool{display:flex;flex-direction:column;gap:10px;background:#eef3f4;border-radius:14px;padding:12px;border:2px dashed #c4d0d4}
.tq-targets{display:flex;flex-direction:column;gap:10px}
.tq-target{border:2px dashed #b9c6cb;border-radius:14px;padding:8px 10px;background:#fff;display:flex;align-items:center;gap:12px;min-height:66px}
.tq-tlabel{font-weight:700;font-size:16px;width:38%;color:var(--tq-accent)}
.tq-slot{flex:1;display:flex;flex-direction:column;gap:6px}
.tq-item{background:#fff;border:2px solid var(--tq-accent);border-radius:10px;padding:10px 12px;font-size:15px;cursor:grab;touch-action:none;position:relative;z-index:1}
.tq-item.drag{cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.2);z-index:5}
.tq-hint{color:#6b7c83;font-size:14px;padding:6px}
</style>

  paintTheme();
  $("#b-open").onclick = function () { $("#f-open").value = ""; $("#f-open").click(); };

    modal("New project", h("p", { style: "margin:0;line-height:1.5", text: "Start from a blank project, or reload the sample course? You can get the current project back with Undo." }),
      [["Cancel", null, ""], ["Sample course", function () { snapshot(); P = demoProject(); ui.slide = null; ui.obj = null; save(); render(); }, ""], ["Blank project", function () { snapshot(); P = newProject(); ui.slide = null; ui.obj = null; save(); render(); }, "primary"]]);
  };
  $("#ptitle").addEventListener("input", function () { var v = this.value; mutate(function () { P.title = v; }, "ptitle", []); });
  $("#cwrap").addEventListener("pointerdown", function (e) { if (e.target.closest(".ed-obj, .ed-h")) return; if (ui.obj) { ui.obj = null; ui.state = "Normal"; render(["canvas", "timeline", "panel"]); } });
  new ResizeObserver(function () { fitZoom(); }).observe($("#cwrap"));
  buildRibbon();
  P = load() || demoProject();
  render();
}
boot();
})();
